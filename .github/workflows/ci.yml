name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Smoke test the CLI against the example dump
        run: |
          go build -o kpf ./cmd/k8s-orphaned-pvc-finder
          ./kpf scan --input examples/cluster-dump.json
          ./kpf scan --input examples/cluster-dump.json --output json
          set +e
          ./kpf scan --input examples/cluster-dump.json --fail-on orphans >/dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 from --fail-on, got $code"; exit 1; }
